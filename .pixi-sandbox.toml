# Reviewed publish plan consumed by `pixi-sandbox plan` and the release-binary reusable
# workflow. Add a target only after its native runner has passed the airlock proof; a
# new target lands as a PR that must stay red-free on its own runner before it is
# merged, so the gate is the review rather than the edit.
#
# `cargo_vendor = false` — the one setting here that differs from the reference
# repositories. This project has no Cargo workspace, so there is nothing to vendor, and
# a `true` would only add an empty vendor tree to every transport and a
# `.cargo/config.toml` pointing at it on every restored machine. The flag and the
# repository's actual content are one decision; if a Rust crate is ever added, this
# becomes `true` in the same commit that adds the crate.
#
# `environments = ["default"]` — one environment. The root pixi.toml has a single
# environment today because QGIS and bun share an icu solve (see its header); splitting
# them is a backlog task, and until it lands there is exactly one environment to pack.
# When the split happens, this becomes `["default", "bun"]` and the publish workflow's
# path filter picks up nothing new — the plan is what changes, and the workflow reads it.
schema = 1
branch_prefix = "sandbox"
cargo_vendor = false

[[bundle]]
name = "developer"
environments = ["default"]
# linux-64 only, matching `[workspace] platforms` in pixi.toml. The plan must stay a
# subset of the workspace's platform list: pixi-sandbox's `plan` fans a matrix out onto
# each named platform's native runner, and a platform the environment was never solved
# for has nothing to pack.
platforms = ["linux-64"]
